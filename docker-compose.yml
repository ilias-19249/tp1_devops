services:

  app:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile

    ports:
      - "8080:80"

    environment:
      DB_HOST: db
      DB_NAME: tasks
      DB_USER: task_user
      DB_PASSWORD: task_password

    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: ./docker/db

    environment:
      MYSQL_DATABASE: tasks
      MYSQL_USER: task_user
      MYSQL_PASSWORD: task_password
      MYSQL_ROOT_PASSWORD: root_password

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "task_user", "-ptask_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
